'section: workflows':
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - .github/workflows/**
'section: repo':
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - '*'
'section: tests':
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - '**/__tests__/**'
'experience: developer':
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - '.editorconfig'
              - '.gitignore'
              - '.prettierrc'
              - 'eslint.config.mjs'
              - '.release-it.json'
              - 'tsconfig*.json'
              - 'typedoc.json'
              - 'scripts/**'
'context: github':
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - .github/**
'context: npm':
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - 'package.json'
'context: rollup':
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - 'rollup.config.js'
'mindless: ✏️ docs':
  - any:
      - head-branch: ['^docs/']
      - changed-files:
          - any-glob-to-any-file:
              - '**/*.md'
'mindless: 📦 dependencies':
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - 'package-lock.json'

# Labels from the branch name: feat/..., fix/..., chore/..., improvements/...
'✨ feature':
  - head-branch: ['^feat/']
'problems: 🐛 bug':
  - head-branch: ['^fix/']
'mindless: 🤖 chore':
  - head-branch: ['^chore/']
'improvements: 💡 enhancement':
  - head-branch: ['^improvements/']
