# OpenSSF Scorecard: scores the repository's security practices and publishes
# the result, https://scorecard.dev/viewer/?uri=github.com/phun-ky/moebius
#
# Actions are pinned to commit SHAs (Scorecard checks for this); the comment on
# each line is the release the SHA belongs to.

name: Scorecard

on:
  # Re-score when branch protection changes, weekly, and on every push to main
  branch_protection_rule:
  schedule:
    - cron: '30 1 * * 1'
  push:
    branches: ['main']
  workflow_dispatch:

# Read-only by default; the job asks for exactly what it needs
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      # Upload the results to GitHub's code scanning dashboard
      security-events: write
      # Publish the results to the public Scorecard API and badge
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
