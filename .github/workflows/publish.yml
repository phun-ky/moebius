# This is a basic workflow to help you get started with Actions

name: Publish

# Controls when the workflow will run
on:
  pull_request:
    types: [closed]
    branches: ['main']
    # Only files that can change what gets released
    paths:
      - 'src/**'
      - 'rollup.config.js'
      - 'tsconfig.build.json'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'README.md'
      - 'LICENSE'
      - '.release-it.json'
      - '.github/scripts/should-release.sh'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    permissions:
      contents: read # Release commits, tags and the GitHub release use GH_TOKEN
      id-token: write # npm trusted publishing (OIDC) and provenance

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Checkout all branches and tags
          token: ${{ secrets.GH_TOKEN }}
      # Node 24 ships npm 11, which supports trusted publishing (needs npm >= 11.5.1).
      # Don't upgrade to npm@latest: npm 12 blocks dependency install scripts by default.
      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Check for changes to release
        id: guard
        run: .github/scripts/should-release.sh
      - name: Audit runtime dependencies # No release with a known high or critical vulnerability
        if: steps.guard.outputs.release == 'true'
        run: npm audit --omit=dev --audit-level=high
      - name: Release # Builds and runs check:pack after the version bump, then publishes
        if: steps.guard.outputs.release == 'true'
        run: |
          git config user.name "$ACTOR"
          git config user.email "$ACTOR@users.noreply.github.com"
          npm run release
        env: # npm authenticates with trusted publishing (id-token: write), no token needed
          ACTOR: ${{ github.actor }} # via env, never interpolated into the script
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Attach an SBOM to the release # CycloneDX, the runtime dependencies
        if: steps.guard.outputs.release == 'true'
        run: |
          version=$(node -p "require('./package.json').version")
          file="$RUNNER_TEMP/moebius-$version.cdx.json"
          npm sbom --sbom-format cyclonedx --omit dev > "$file"
          gh release upload "$version" "$file" --clobber
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
  notify:
    name: Notify failed build
    needs: publish
    if: failure()
    runs-on: ubuntu-24.04
    # GITHUB_TOKEN is enough to open an issue, and unlike GH_TOKEN it isn't
    # empty on Dependabot PRs
    permissions:
      issues: write
    steps:
      - uses: drivendataorg/failed-build-issue-action@940568ce50eeef3f31a920614cefcc6102d2f930 # v1.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          label-name: 'problems: 💔 build failed'
          create-label: false
