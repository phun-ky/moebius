# This is a basic workflow to help you get started with Actions

name: Checks

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: ['main']
    paths:
      - '.github/**'
      - 'src/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'rollup.config.js'
      - 'tsconfig*.json'
      - 'typedoc.json'
      - 'scripts/**'
      - 'eslint.config.mjs'
      - '.prettierrc'
      - '**/*.md'
      - '.bestpractices.json'
      - 'security-insights.yml'
  pull_request:
    branches: ['main']
    types: [opened, synchronize] # Workflow triggering events
    # No paths filter: check is a required status, so it must run on every PR,
    # or a PR touching only unlisted files could never merge

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
permissions:
  contents: read

jobs:
  # This workflow contains a single job called "check"
  check:
    # The type of runner that the job will run on
    runs-on: ubuntu-24.04

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Checkout all branches and tags
      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: | # Install and link dependencies
          npm ci
      - name: Lint
        run: npm run style:lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build # Build all packages
        run: npm run build
      - name: Check the package
        run: npm run check:pack
      - name: Check the docs # API docs without warnings, and every guide example runs
        run: npm run docs:check
      - name: Check the OpenSSF answers # Valid statuses, and every linked file and heading exists
        run: npm run check:bestpractices
      - name: Build the docs # Dead links fail here instead of in the deploy
        run: |
          npm run docs:gen
          npm run docs:build
      - name: Test
        run: npm run test:ci
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: phun-ky/moebius
  notify:
    name: Notify failed check
    needs: check
    if: failure()
    runs-on: ubuntu-24.04
    # GITHUB_TOKEN is enough to open an issue, and unlike GH_TOKEN it isn't
    # empty on Dependabot PRs
    permissions:
      issues: write
    steps:
      - uses: drivendataorg/failed-build-issue-action@940568ce50eeef3f31a920614cefcc6102d2f930 # v1.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          label-name: 'problems: 💔 build failed'
          create-label: false
