# This is a basic workflow to help you get started with Actions

name: Checks

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: ['main']
    paths:
      - '.github/**'
      - 'src/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'rollup.config.js'
      - 'tsconfig*.json'
      - 'typedoc.json'
      - 'eslint.config.mjs'
      - '.prettierrc'
      - '**/*.md'
  pull_request:
    branches: ['main']
    types: [opened, synchronize] # Workflow triggering events
    paths:
      - '.github/**'
      - 'src/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'rollup.config.js'
      - 'tsconfig*.json'
      - 'typedoc.json'
      - 'eslint.config.mjs'
      - '.prettierrc'
      - '**/*.md'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "check"
  check:
    # The type of runner that the job will run on
    runs-on: ubuntu-24.04

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Checkout all branches and tags
      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: | # Install and link dependencies
          npm ci
      - name: Lint
        run: npm run style:lint
      - name: Build # Build all packages
        run: npm run build
      - name: Test
        run: npm run test:ci
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: phun-ky/moebius
  notify:
    name: Notify failed check
    needs: check
    if: failure()
    runs-on: ubuntu-24.04
    steps:
      - uses: drivendataorg/failed-build-issue-action@v1
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          label-name: 'problems: 💔 build failed'
