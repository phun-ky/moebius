version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    # Minor and patch updates are grouped into one PR. Major updates are left
    # ungrouped, so each one gets its own PR that can be tested and merged alone.
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # TypeScript 7 drops the compiler API that typedoc, typescript-eslint and
      # rollup-plugin-typescript2 use. Remove this once they support it.
      - dependency-name: 'typescript'
        versions: ['>=7']
      # jsdom and global-jsdom majors only install together, and the tests are
      # fine on jsdom 29. Stay on 29 until there's a reason to move.
      - dependency-name: 'jsdom'
        update-types: ['version-update:semver-major']
      - dependency-name: 'global-jsdom'
        update-types: ['version-update:semver-major']
      # Keep @types/node on the Node major CI runs (24)
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    schedule:
      interval: 'weekly'
    labels:
      - 'mindless: 📦 dependencies'
    # Only propose versions that have been out for at least 2 weeks, so broken
    # or compromised releases are found first. Security updates are not delayed.
    cooldown:
      default-days: 14
    commit-message:
      prefix: 'chore: 🤖 '
    open-pull-requests-limit: 5
    allow:
      - dependency-type: direct
      - dependency-type: production

  # Actions are pinned to commit SHAs; this keeps the pins and their version
  # comments up to date
  - package-ecosystem: 'github-actions'
    directory: '/'
    # Minor and patch updates are grouped; each major gets its own PR, so one
    # blocked major doesn't hold back the rest
    groups:
      actions:
        update-types:
          - 'minor'
          - 'patch'
    schedule:
      interval: 'weekly'
    labels:
      - 'mindless: 📦 dependencies'
    cooldown:
      default-days: 14
    commit-message:
      prefix: 'ci: 🎡 '
